<!DOCTYPE html>
<html lang="ko">
 <head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>결제하기 - 온라인 강의 플랫폼</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/responsive.css" />
 </head>
 <body>
  <!-- 헤더 (웹 컴포넌트) -->
  <app-header></app-header>

  <!-- 결제 섹션 -->
  <section class="checkout-section">
   <div class="container">
    <h1 class="section-title">결제하기</h1>

    <div class="checkout-layout">
     <!-- 결제 폼 -->
     <div class="checkout-form-container">
      <!-- 주문 상품 -->
      <div class="checkout-card">
       <h2>주문 상품</h2>
       <div class="order-items" id="orderItems">
        <!-- 주문 상품이 동적으로 추가됩니다 -->
       </div>
      </div>

      <!-- 결제 수단 선택 -->
      <div class="checkout-card">
       <h2>결제 수단</h2>
       <div class="payment-methods" id="paymentMethods">
        <label class="payment-method-option">
         <input type="radio" name="paymentMethod" value="card" checked />
         <span class="payment-method-label">
          <span class="payment-icon">
           <svg
            xmlns="http://www.w3.org/2000/svg"
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
           >
            <rect width="20" height="14" x="2" y="5" rx="2" />
            <line x1="2" x2="22" y1="10" y2="10" />
           </svg>
          </span>
          <span class="payment-name">신용/체크카드</span>
         </span>
        </label>
        <label class="payment-method-option">
         <input type="radio" name="paymentMethod" value="bank" />
         <span class="payment-method-label">
          <span class="payment-icon">
           <svg
            xmlns="http://www.w3.org/2000/svg"
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
           >
            <line x1="3" x2="21" y1="22" y2="22" />
            <line x1="6" x2="6" y1="18" y2="11" />
            <line x1="10" x2="10" y1="18" y2="11" />
            <line x1="14" x2="14" y1="18" y2="11" />
            <line x1="18" x2="18" y1="18" y2="11" />
            <polygon points="12 2 20 7 4 7" />
           </svg>
          </span>
          <span class="payment-name">계좌이체</span>
         </span>
        </label>
        <label class="payment-method-option">
         <input type="radio" name="paymentMethod" value="phone" />
         <span class="payment-method-label">
          <span class="payment-icon">
           <svg
            xmlns="http://www.w3.org/2000/svg"
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
           >
            <rect width="14" height="20" x="5" y="2" rx="2" ry="2" />
            <path d="M12 18h.01" />
           </svg>
          </span>
          <span class="payment-name">휴대폰 결제</span>
         </span>
        </label>
        <label class="payment-method-option">
         <input type="radio" name="paymentMethod" value="kakao" />
         <span class="payment-method-label">
          <span class="payment-icon">
           <svg
            xmlns="http://www.w3.org/2000/svg"
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
           >
            <path d="M17 18a2 2 0 0 0-2-2H9a2 2 0 0 0-2 2" />
            <rect width="18" height="18" x="3" y="4" rx="2" />
            <circle cx="12" cy="10" r="2" />
            <line x1="8" x2="8" y1="2" y2="4" />
            <line x1="16" x2="16" y1="2" y2="4" />
           </svg>
          </span>
          <span class="payment-name">카카오페이</span>
         </span>
        </label>
       </div>
      </div>

      <!-- 약관 동의 -->
      <div class="checkout-card">
       <h2>약관 동의</h2>
       <div class="terms-agreement">
        <label class="checkbox-label">
         <input type="checkbox" id="agreeAll" />
         <span>전체 동의</span>
        </label>
        <div class="terms-list">
         <label class="checkbox-label">
          <input type="checkbox" class="term-checkbox" data-required="true" />
          <span>(필수) 구매조건 확인 및 결제 진행 동의</span>
         </label>
         <label class="checkbox-label">
          <input type="checkbox" class="term-checkbox" data-required="true" />
          <span>(필수) 개인정보 제3자 제공 동의</span>
         </label>
         <label class="checkbox-label">
          <input type="checkbox" class="term-checkbox" data-required="false" />
          <span>(선택) 마케팅 정보 수신 동의</span>
         </label>
        </div>
       </div>
      </div>
     </div>

     <!-- 결제 요약 -->
     <aside class="checkout-summary" id="checkoutSummary">
      <!-- 결제 요약이 동적으로 추가됩니다 -->
     </aside>
    </div>
   </div>
  </section>

  <!-- 푸터 (웹 컴포넌트) -->
  <app-footer></app-footer>

  <!-- ES 모듈 방식의 앱 진입점 -->
  <script type="module" src="js/app.js" data-page="checkout"></script>
 </body>
</html>
