<!DOCTYPE html>
<html lang="ko">
 <head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>학습 대시보드 - 온라인 강의 플랫폼</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/responsive.css" />
 </head>
 <body>
  <!-- 헤더 (웹 컴포넌트) -->
  <app-header></app-header>

  <!-- 학습 대시보드 섹션 -->
  <section class="dashboard-section">
   <div class="container">
    <div class="dashboard-header">
     <h1 class="section-title">학습 대시보드</h1>
     <a href="courses.html" class="btn btn-primary">새 강의 둘러보기</a>
    </div>

    <!-- 학습 진도 요약 -->
    <div class="dashboard-summary" id="dashboardSummary">
     <!-- 요약 정보가 여기에 동적으로 추가됩니다 -->
    </div>

    <!-- 수강 중인 강의 -->
    <div class="dashboard-section-content">
     <h2>수강 중인 강의</h2>
     <div class="courses-grid" id="enrolledCourses">
      <!-- 강의 카드가 여기에 동적으로 추가됩니다 -->
     </div>
    </div>

    <!-- 완료한 강의 -->
    <div class="dashboard-section-content">
     <h2>완료한 강의</h2>
     <div class="courses-grid" id="completedCourses">
      <!-- 강의 카드가 여기에 동적으로 추가됩니다 -->
     </div>
    </div>

    <!-- 최근 학습한 강의 -->
    <div class="dashboard-section-content">
     <h2>최근 학습한 강의</h2>
     <div class="courses-grid" id="recentCourses">
      <!-- 강의 카드가 여기에 동적으로 추가됩니다 -->
     </div>
    </div>
   </div>
  </section>

  <!-- 푸터 (웹 컴포넌트) -->
  <app-footer></app-footer>

  <!-- ES 모듈 방식의 앱 진입점 -->
  <script type="module" src="js/app.js" data-page="dashboard"></script>
 </body>
</html>
