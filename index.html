<!DOCTYPE html>
<html lang="ko">
 <head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>온라인 강의 플랫폼 - 메인</title>
  <!-- Swiper CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/responsive.css" />
 </head>
 <body>
  <!-- 헤더 (웹 컴포넌트) -->
  <app-header></app-header>

  <!-- 히어로 섹션 -->
  <section class="hero">
   <div class="container">
    <div class="hero-layout">
     <div class="hero-content">
      <h1>
       <span class="hero-title-line1">내일을 위한 배움,</span>
       <span class="hero-title-line2">오늘 시작하세요!</span>
      </h1>
      <p class="hero-description">
       최고의 강사진이 제공하는 실무 중심 커리큘럼! 지금 바로 수강하고! 커리어를 성장시키세요!
      </p>
      <div class="hero-buttons">
       <a href="courses.html" class="btn btn-primary">강의 둘러보기</a>
       <a href="signup.html" class="btn btn-outline">무료로 시작하기</a>
      </div>
     </div>
     <div class="hero-carousel">
      <div class="swiper hero-swiper">
       <div class="swiper-wrapper">
        <div class="swiper-slide">
         <img src="https://picsum.photos/800/600?random=10" alt="강의 이미지" />
         <div class="carousel-overlay">
          <h3>체계적인 로드맵</h3>
          <p>목표 달성을 위한 확실한 길잡이</p>
         </div>
        </div>
        <div class="swiper-slide">
         <img src="https://picsum.photos/800/600?random=11" alt="강의 이미지" />
         <div class="carousel-overlay">
          <h3>실무 중심 커리큘럼</h3>
          <p>현장에서 바로 쓸 수 있는 실전 지식</p>
         </div>
        </div>
        <div class="swiper-slide">
         <img src="https://picsum.photos/800/600?random=12" alt="강의 이미지" />
         <div class="carousel-overlay">
          <h3>전문가 강의</h3>
          <p>업계 최고의 강사진과 함께하는 학습</p>
         </div>
        </div>
       </div>
       <div class="carousel-controls">
        <span class="carousel-counter">
         <span class="swiper-counter-current">1</span>/<span class="swiper-counter-total">3</span>
        </span>
        <button class="carousel-btn swiper-button-prev-custom" aria-label="이전 슬라이드">‹</button>
        <button class="carousel-btn swiper-button-play-pause" aria-label="캐러셀 일시정지">
         <svg
          xmlns="http://www.w3.org/2000/svg"
          width="14"
          height="14"
          viewBox="0 0 24 24"
          fill="currentColor"
          stroke="none"
         >
          <rect x="6" y="4" width="4" height="16" />
          <rect x="14" y="4" width="4" height="16" />
         </svg>
        </button>
        <button class="carousel-btn swiper-button-next-custom" aria-label="다음 슬라이드">›</button>
       </div>
      </div>
     </div>
    </div>
   </div>
  </section>

  <!-- 인기 강의 섹션 -->
  <section class="popular-courses">
   <div class="container">
    <div class="section-header">
     <h2 class="section-title">인기 강의</h2>
     <a href="courses.html?sort=students" class="section-link">
      더 보기
      <svg
       xmlns="http://www.w3.org/2000/svg"
       width="16"
       height="16"
       viewBox="0 0 24 24"
       fill="none"
       stroke="currentColor"
       stroke-width="2"
       stroke-linecap="round"
       stroke-linejoin="round"
      >
       <path d="m9 18 6-6-6-6" />
      </svg>
     </a>
    </div>
    <div class="swiper-container">
     <div class="swiper courses-swiper" id="popularCoursesSwiper">
      <div class="swiper-wrapper" id="popularCourses">
       <!-- 강의 카드가 여기에 동적으로 추가됩니다 -->
      </div>
     </div>
     <button class="swiper-nav-btn swiper-nav-prev popular-prev" aria-label="이전">
      <svg
       xmlns="http://www.w3.org/2000/svg"
       width="24"
       height="24"
       viewBox="0 0 24 24"
       fill="none"
       stroke="currentColor"
       stroke-width="2"
       stroke-linecap="round"
       stroke-linejoin="round"
      >
       <path d="m15 18-6-6 6-6" />
      </svg>
     </button>
     <button class="swiper-nav-btn swiper-nav-next popular-next" aria-label="다음">
      <svg
       xmlns="http://www.w3.org/2000/svg"
       width="24"
       height="24"
       viewBox="0 0 24 24"
       fill="none"
       stroke="currentColor"
       stroke-width="2"
       stroke-linecap="round"
       stroke-linejoin="round"
      >
       <path d="m9 18 6-6-6-6" />
      </svg>
     </button>
    </div>
   </div>
  </section>

  <!-- 신규 강의 섹션 -->
  <section class="new-courses">
   <div class="container">
    <div class="section-header">
     <h2 class="section-title">신규 강의</h2>
     <a href="courses.html?sort=newest" class="section-link">
      더 보기
      <svg
       xmlns="http://www.w3.org/2000/svg"
       width="16"
       height="16"
       viewBox="0 0 24 24"
       fill="none"
       stroke="currentColor"
       stroke-width="2"
       stroke-linecap="round"
       stroke-linejoin="round"
      >
       <path d="m9 18 6-6-6-6" />
      </svg>
     </a>
    </div>
    <div class="swiper-container">
     <div class="swiper courses-swiper" id="newCoursesSwiper">
      <div class="swiper-wrapper" id="newCourses">
       <!-- 강의 카드가 여기에 동적으로 추가됩니다 -->
      </div>
     </div>
     <button class="swiper-nav-btn swiper-nav-prev new-prev" aria-label="이전">
      <svg
       xmlns="http://www.w3.org/2000/svg"
       width="24"
       height="24"
       viewBox="0 0 24 24"
       fill="none"
       stroke="currentColor"
       stroke-width="2"
       stroke-linecap="round"
       stroke-linejoin="round"
      >
       <path d="m15 18-6-6 6-6" />
      </svg>
     </button>
     <button class="swiper-nav-btn swiper-nav-next new-next" aria-label="다음">
      <svg
       xmlns="http://www.w3.org/2000/svg"
       width="24"
       height="24"
       viewBox="0 0 24 24"
       fill="none"
       stroke="currentColor"
       stroke-width="2"
       stroke-linecap="round"
       stroke-linejoin="round"
      >
       <path d="m9 18 6-6-6-6" />
      </svg>
     </button>
    </div>
   </div>
  </section>

  <!-- 카테고리 섹션 -->
  <section class="categories">
   <div class="container">
    <h2 class="section-title">카테고리</h2>
    <div class="categories-grid">
     <div class="category-card" data-category="programming">
      <img src="https://picsum.photos/400/200?random=1" alt="프로그래밍" />
      <h3>프로그래밍</h3>
     </div>
     <div class="category-card" data-category="design">
      <img src="https://picsum.photos/400/200?random=2" alt="디자인" />
      <h3>디자인</h3>
     </div>
     <div class="category-card" data-category="marketing">
      <img src="https://picsum.photos/400/200?random=3" alt="마케팅" />
      <h3>마케팅</h3>
     </div>
     <div class="category-card" data-category="others">
      <img src="https://picsum.photos/400/200?random=4" alt="기타" />
      <h3>기타</h3>
     </div>
    </div>
   </div>
  </section>

  <!-- 푸터 (웹 컴포넌트) -->
  <app-footer></app-footer>

  <!-- 스크립트 -->
  <!-- Swiper JS (캐러셀 라이브러리) -->
  <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
  <!-- ES 모듈 방식의 앱 진입점 -->
  <script type="module" src="js/app.js" data-page="main"></script>
 </body>
</html>
