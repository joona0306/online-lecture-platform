<!DOCTYPE html>
<html lang="ko">
 <head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>강의 목록 - 온라인 강의 플랫폼</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/responsive.css" />
 </head>
 <body>
  <!-- 헤더 -->
  <header class="header">
   <div class="container">
    <div class="header-content">
     <div class="logo">
      <a href="index.html">
       <span class="logo-icon">🔧</span>
       <span class="logo-text">EduEdu</span>
      </a>
     </div>

     <div class="header-center">
      <!-- 검색 -->
      <div class="search-box">
       <label class="sr-only" for="searchInput">강의 검색</label>
       <span class="search-icon">🔍</span>
       <input
        id="searchInput"
        type="text"
        placeholder="강의를 검색해보세요"
        autocomplete="off"
       />
       <div class="search-dropdown" id="searchDropdown" style="display: none">
        <div class="search-dropdown-header">
         <span>최근 검색어</span>
         <button class="clear-search" id="clearSearch">전체 삭제</button>
        </div>
        <div class="recent-searches" id="recentSearches"></div>
        <div class="search-dropdown-header">
         <span>🏔️ 추천 검색어</span>
        </div>
        <div class="recommended-searches">
         <a href="courses.html?query=UX/UI 디자인">UX/UI 디자인</a>
         <a href="courses.html?query=웹퍼블리싱">웹퍼블리싱</a>
         <a href="courses.html?query=웹디자인">웹디자인</a>
        </div>
       </div>
      </div>
     </div>

     <div class="header-actions">
      <!-- 사용자 -->
      <div class="user-menu">
       <a href="login.html" class="btn btn-ghost" id="loginBtn">로그인</a>
       <div
        class="user-profile-wrapper"
        id="userProfileWrapper"
        style="display: none"
       >
        <button class="user-profile-btn" id="userProfileBtn">
         <img
          src="https://picsum.photos/40/40?random=100"
          alt="프로필"
          class="user-avatar"
          id="userAvatar"
         />
         <span id="userName"></span>
         <span class="dropdown-icon">▼</span>
        </button>
        <div class="user-dropdown" id="userDropdown" style="display: none">
         <a href="profile.html">마이 페이지</a>
         <a href="dashboard.html">내 강의보기</a>
         <a href="#" id="transactionLink">거래내역</a>
         <a href="#" id="logoutLink">로그아웃</a>
        </div>
       </div>
      </div>
     </div>
    </div>
   </div>
  </header>

  <!-- 강의 목록 섹션 -->
  <section class="courses-section">
   <div class="container">
    <h1 class="section-title">전체 강의</h1>

    <div class="courses-layout">
     <!-- 필터 사이드바 -->
     <aside class="filter-sidebar">
      <h2>필터</h2>

      <!-- 카테고리 필터 -->
      <div class="filter-group">
       <h3>카테고리</h3>
       <div class="filter-option">
        <input
         type="radio"
         name="category"
         id="category-all"
         value=""
         checked
        />
        <label for="category-all">전체</label>
       </div>
       <div class="filter-option">
        <input
         type="radio"
         name="category"
         id="category-programming"
         value="programming"
        />
        <label for="category-programming">프로그래밍</label>
       </div>
       <div class="filter-option">
        <input
         type="radio"
         name="category"
         id="category-design"
         value="design"
        />
        <label for="category-design">디자인</label>
       </div>
       <div class="filter-option">
        <input
         type="radio"
         name="category"
         id="category-marketing"
         value="marketing"
        />
        <label for="category-marketing">마케팅</label>
       </div>
       <div class="filter-option">
        <input
         type="radio"
         name="category"
         id="category-others"
         value="others"
        />
        <label for="category-others">기타</label>
       </div>
      </div>

      <!-- 가격 필터 -->
      <div class="filter-group">
       <h3>가격</h3>
       <div class="filter-option">
        <input type="radio" name="price" id="price-all" value="" checked />
        <label for="price-all">전체</label>
       </div>
       <div class="filter-option">
        <input type="radio" name="price" id="price-free" value="free" />
        <label for="price-free">무료</label>
       </div>
       <div class="filter-option">
        <input type="radio" name="price" id="price-paid" value="paid" />
        <label for="price-paid">유료</label>
       </div>
      </div>

      <!-- 난이도 필터 -->
      <div class="filter-group">
       <h3>난이도</h3>
       <div class="filter-option">
        <input type="radio" name="level" id="level-all" value="" checked />
        <label for="level-all">전체</label>
       </div>
       <div class="filter-option">
        <input type="radio" name="level" id="level-beginner" value="beginner" />
        <label for="level-beginner">초급</label>
       </div>
       <div class="filter-option">
        <input
         type="radio"
         name="level"
         id="level-intermediate"
         value="intermediate"
        />
        <label for="level-intermediate">중급</label>
       </div>
       <div class="filter-option">
        <input type="radio" name="level" id="level-advanced" value="advanced" />
        <label for="level-advanced">고급</label>
       </div>
      </div>

      <!-- 필터 초기화 -->
      <button class="btn btn-secondary" id="resetFilters">필터 초기화</button>
     </aside>

     <!-- 강의 목록 영역 -->
     <div class="courses-main">
      <!-- 정렬 및 결과 개수 -->
      <div class="sort-controls">
       <div class="results-count">
        <span id="resultsCount">0</span>개의 강의
       </div>
       <div class="sort-select-wrapper">
        <label for="sortSelect" class="sr-only">정렬</label>
        <select id="sortSelect" class="sort-select">
         <option value="popular">인기순</option>
         <option value="newest">최신순</option>
         <option value="price-low">가격 낮은순</option>
         <option value="price-high">가격 높은순</option>
         <option value="rating">평점순</option>
        </select>
       </div>
      </div>

      <!-- 강의 그리드 -->
      <div class="courses-grid" id="coursesGrid">
       <!-- 강의 카드가 여기에 동적으로 추가됩니다 -->
      </div>

      <!-- 페이지네이션 -->
      <div class="pagination" id="pagination">
       <!-- 페이지네이션이 여기에 동적으로 추가됩니다 -->
      </div>
     </div>
    </div>
   </div>
  </section>

  <!-- 푸터 -->
  <footer class="footer">
   <div class="container">
    <div class="footer-content">
     <div class="footer-section">
      <h3>회사 정보</h3>
      <p>온라인 강의 플랫폼</p>
     </div>
     <div class="footer-section">
      <h3>고객센터</h3>
      <p>전화: 1588-0000</p>
      <p>이메일: support@learn.com</p>
     </div>
    </div>
   </div>
  </footer>

  <!-- 스크립트 -->
  <script src="js/storage.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/courses.js"></script>
 </body>
</html>
