<!DOCTYPE html>
<html lang="ko">
 <head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>회원가입 - 온라인 강의 플랫폼</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/responsive.css" />
 </head>
 <body>
  <!-- 헤더 (웹 컴포넌트) - 회원가입 페이지에서는 로그인 링크 표시 -->
  <app-header show-auth-link="signup"></app-header>

  <!-- 회원가입 섹션 -->
  <section class="auth-section">
   <div class="container">
    <div class="auth-container">
     <h1>회원가입</h1>
     <form id="signupForm" class="auth-form" novalidate>
      <div class="form-group">
       <label for="name">이름</label>
       <input 
        type="text" 
        id="name" 
        name="name" 
        required 
        autocomplete="name"
        placeholder="이름을 입력하세요"
       />
       <div class="form-error" id="nameError"></div>
      </div>

      <div class="form-group">
       <label for="email">이메일</label>
       <input 
        type="email" 
        id="email" 
        name="email" 
        required 
        autocomplete="email"
        placeholder="example@email.com"
       />
       <div class="form-error" id="emailError"></div>
      </div>

      <div class="form-group">
       <label for="password">비밀번호</label>
       <input
        type="password"
        id="password"
        name="password"
        required
        minlength="4"
        autocomplete="new-password"
        placeholder="4자 이상 입력하세요"
       />
       <div class="form-error" id="passwordError"></div>
      </div>

      <div class="form-group">
       <label for="passwordConfirm">비밀번호 확인</label>
       <input
        type="password"
        id="passwordConfirm"
        name="passwordConfirm"
        required
        autocomplete="new-password"
        placeholder="비밀번호를 다시 입력하세요"
       />
       <div class="form-error" id="passwordConfirmError"></div>
      </div>

      <div class="form-group">
       <label for="role">역할</label>
       <select id="role" name="role" required>
        <option value="student">수강생</option>
        <option value="instructor">강사</option>
       </select>
       <div class="form-error" id="roleError"></div>
      </div>

      <button type="submit" class="btn btn-primary btn-block">회원가입</button>
     </form>

     <div class="auth-footer">
      <p>이미 계정이 있으신가요? <a href="login.html">로그인</a></p>
     </div>
    </div>
   </div>
  </section>

  <!-- 푸터 (웹 컴포넌트) -->
  <app-footer></app-footer>

  <!-- ES 모듈 방식의 앱 진입점 -->
  <script type="module" src="js/app.js" data-page="signup"></script>
 </body>
</html>
